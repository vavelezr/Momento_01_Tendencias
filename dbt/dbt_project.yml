name: 'yelp_goodyear_analytics'
version: '1.0.0'
config-version: 2

# Coincide con el nombre de perfil en profiles.yml (no versionado — ver profiles.yml.example).
profile: 'yelp_goodyear_analytics'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

# Arquitectura Medallón (Sesión 7 del curso): la carpeta declara la capa, la capa declara
# la materialización y el esquema físico en Snowflake.
#   Bronze = RAW/STAGING de Snowflake (ya existen, fuera de este proyecto -- Momento 1/2).
#   Silver = staging/  -- cast y rename, VIEW (relectura barata de la fuente cruda).
#   Gold   = core/     -- listos para consumo, TABLE (agregan/cruzan datos; se persisten
#            para no pagar ese costo en cada consulta).
# +schema por capa separa físicamente ANALYTICS_STAGING de ANALYTICS_CORE en Snowflake
# (dbt antepone el schema del target -- ANALYTICS -- al valor de +schema).
models:
  yelp_goodyear_analytics:
    staging:
      +materialized: view
      +schema: staging
    core:
      +materialized: table
      +schema: core
